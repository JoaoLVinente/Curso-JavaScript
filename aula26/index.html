<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela IMC</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <section class="container">
        <h1>
            Tabela IMC
        </h1>
        <div class="referencias">
            <div class="lista-imc">
                <div>
                    <h3>IMC</h3>
                    <ul>
                        <li>Menos do que 18,5</li>
                        <li>Entre 18,5 e 24,9</li>
                        <li>Entre 25 e 29,9</li>
                        <li>Entre 30 e 34,9</li>
                        <li>Entre 35 e 39,9</li>
                        <li>Mais do que 40 ou mais</li>
                    </ul>
                </div>

                <div>
                    <h3>Resultado</h3>
                    <ul>
                        <li>Abaixo do peso</li>
                        <li>Peso normal</li>
                        <li>Sobrepeso</li>
                        <li>Obesidade grau 1</li>
                        <li>Obesidade grau 2</li>
                        <li>Obesidade grau 3</li>
                    </ul>
                </div>
            </div>
        </div>
        <h2>
            Calcule seu IMC
        </h2>
        <form action="" class="form">
            <label for="peso">Coloque seu peso:</label>
            <input type="text" id="peso">

            <label for="altura">Coloque sua altura:</label>
            <input type="text" id="altura">

            <button type="submit">Calcular</button>
            <div class="quadroResultado">
                <p class="resultado">Resultado</p>
            </div>
        </form>
    </section>

    <script src="./assets/js/main.js"></script>
</body>
</html>
